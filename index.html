<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap to Age 90™ — Client Intake &amp; Projection</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#0f1b2d; --muted:#5b6b82; --line:#e2e8f2;
  --brand:#12385f; --brand2:#1d5f9c; --gold:#b8860b; --gold-l:#fdf6e3;
  --ok:#0f7b4f; --ok-bg:#e8f6ef; --warn:#8a5a00; --warn-bg:#fdf3e0;
  --bad:#a4262c; --bad-bg:#fdeceb; --info:#1d5f9c; --info-bg:#e9f1fa;
  --r:10px; --sh:0 1px 2px rgba(16,32,56,.06),0 4px 14px rgba(16,32,56,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;font-weight:650}
h1{font-size:1.5rem} h2{font-size:1.18rem} h3{font-size:1rem} h4{font-size:.9rem}
p{margin:0 0 .8em}
a{color:var(--brand2)}
small{color:var(--muted)}
code{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:#eef2f8;padding:1px 5px;border-radius:4px}

/* ---------- header ---------- */
header{background:linear-gradient(100deg,#0d2946,#17436f 55%,#8a6410);color:#fff;padding:20px 26px}
.hwrap{width:100%;padding:0 8px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hwrap h1{color:#fff;margin:0}
.tag{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hsub{opacity:.88;font-size:.85rem;margin:2px 0 0;max-width:64ch}
.hactions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- buttons ---------- */
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:8px 14px;
  background:var(--brand);color:#fff;font-weight:560;transition:.13s}
button:hover{filter:brightness(1.1)} button:active{transform:translateY(1px)}
button:disabled{opacity:.42;cursor:not-allowed;transform:none;filter:none}
.btn-ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.btn-sec{background:#fff;color:var(--brand);border-color:var(--line)}
.btn-sm{padding:5px 10px;font-size:.82rem}
.btn-danger{background:#fff;color:var(--bad);border-color:#f0c9c7}
.btn-gold{background:var(--gold);color:#fff}

/* ---------- progress ---------- */
.prog{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.pwrap{width:100%;padding:9px 26px;display:flex;gap:5px;overflow-x:auto}
.pstep{flex:0 0 auto;font-size:.74rem;padding:5px 10px;border-radius:20px;border:1px solid var(--line);
  background:#fff;color:var(--muted);white-space:nowrap;font-weight:550}
.pstep.done{background:var(--ok-bg);border-color:#bfe3d3;color:var(--ok)}
.pstep.cur{background:var(--brand);border-color:var(--brand);color:#fff}
.pbar{height:3px;background:var(--line)} .pbar>i{display:block;height:100%;background:var(--gold);transition:width .3s}

/* ---------- layout ---------- */
main{width:100%;max-width:1400px;margin:0 auto;padding:22px 26px 70px}
main>div{min-width:0}
.hwrap,.pwrap{max-width:1760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px}
.card>h2{display:flex;align-items:center;gap:9px}
.mnum{background:var(--brand);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:20px;font-weight:600}
.lede{color:var(--muted);font-size:.88rem;margin:-2px 0 18px;max-width:86ch;overflow-wrap:anywhere}
.card>p,.card>h3+p{max-width:86ch}
.note{max-width:100%;overflow-wrap:anywhere}
.card{min-width:0;overflow-wrap:break-word}
.card>h2{flex-wrap:wrap;row-gap:4px}

/* ---------- fields ----------
   Each .f spans three grid rows and uses `subgrid`, so every label in a row shares
   one row, every control shares the next and every hint the last.  Controls line up
   even when one label wraps to two lines.  A min-height fallback covers old browsers. */
.grid{display:grid;column-gap:18px;row-gap:16px;align-items:start;
  grid-template-columns:repeat(1,minmax(0,1fr));grid-auto-rows:auto}
@media(min-width:620px) {.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1080px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1640px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.f{display:grid;row-gap:5px;min-width:0;align-content:start;
   grid-template-rows:auto auto auto}
@supports(grid-template-rows:subgrid){
  .grid{grid-auto-rows:auto}
  .f{grid-row:span 3;grid-template-rows:subgrid}
}
@supports not (grid-template-rows:subgrid){
  .f>label{min-height:2.5em;display:flex;align-items:flex-end}
  .f>.hint,.f>.emsg{min-height:1.1em}
}
.f.wide{grid-column:1/-1}
.f.tall{grid-column:1/-1}
@supports(grid-template-rows:subgrid){.f.tall{grid-row:span 3}}
.f>label{font-size:.81rem;font-weight:560;line-height:1.3;overflow-wrap:anywhere;
  align-self:end;margin:0}
.f .hint{font-size:.74rem;color:var(--muted);line-height:1.35;overflow-wrap:anywhere;align-self:start}
.f>.affix,.f>input,.f>select,.f>textarea{align-self:start}

input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  background:#fff;color:var(--ink);width:100%;min-width:0;height:40px;line-height:1.2}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235b6b82'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:30px;
  text-overflow:ellipsis}
input:focus,select:focus,textarea:focus{outline:2px solid #b9d3ee;outline-offset:-1px;border-color:var(--brand2)}
input[type=checkbox]{width:auto;height:auto;margin:0}
input[type=date]{padding-right:8px}
textarea{min-height:88px;height:auto;resize:vertical;line-height:1.5}

/* checkbox field occupies the control row and keeps the grid rhythm */
.f.chkf{grid-row:span 3}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:.85rem;
  border:1px solid var(--line);border-radius:7px;padding:10px 11px;background:#fff;min-height:40px}
.chk input{margin-top:2px;flex:0 0 auto}
.chk span{overflow-wrap:anywhere}

fieldset{border:1px solid var(--line);border-radius:9px;padding:16px;margin:18px 0 14px;min-width:0}
legend{font-size:.8rem;font-weight:620;padding:0 7px;color:var(--brand)}

/* ---------- repeatable ---------- */
.rep{border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px;background:#fbfcfe}
.rep-hd{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.rep-hd strong{font-size:.87rem;flex:0 0 auto}
.rep-hd small{color:var(--muted);overflow-wrap:anywhere;flex:1 1 200px;min-width:0}
.rep-hd button{flex:0 0 auto}
.rep-hd button[data-dup]{margin-left:auto}
.rep{padding:16px;min-width:0}
.empty{color:var(--muted);font-size:.85rem;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:9px;margin-bottom:12px}

/* ---------- notes ---------- */
.note{border-radius:8px;padding:10px 13px;font-size:.83rem;margin:11px 0;border-left:3px solid}
.note.i{background:var(--info-bg);border-color:var(--info)}
.note.w{background:var(--warn-bg);border-color:var(--warn)}
.note.b{background:var(--bad-bg);border-color:var(--bad)}
.note.o{background:var(--ok-bg);border-color:var(--ok)}
.note b{font-weight:640}

/* ---------- static content: everything wraps, nothing overflows ---------- */
.kpi,.mile,.tst,.note,.rep,fieldset{min-width:0;overflow-wrap:anywhere}
.kpi .v,.mile .v{font-variant-numeric:tabular-nums;overflow-wrap:normal}
.miles{scrollbar-width:thin}
.mile{flex:0 0 140px}
.tabs{row-gap:2px}
.tst{flex-wrap:wrap}
.tst .n{flex:0 0 auto}
.hsub{overflow-wrap:anywhere}
.hactions{flex-shrink:0}
h1,h2,h3,h4{overflow-wrap:anywhere}

.side{position:sticky;top:62px;min-width:0}
.side>.card:first-child{max-height:calc(100vh - 150px);overflow-y:auto;scrollbar-width:thin}
@media(max-width:1180px){.side{position:static}
  .side>.card:first-child{max-height:none;overflow:visible}}

h3.sub{font-size:.95rem;font-weight:600;margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
/* ---------- nav ---------- */
.nav{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;row-gap:8px}
.nav .sp{flex:1 1 auto;text-align:right}
.nav .sp{margin-left:auto;font-size:.78rem;color:var(--muted)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;margin:12px 0;
  max-width:100%;-webkit-overflow-scrolling:touch}
.tw table{min-width:max-content}
table{border-collapse:collapse;width:100%;font-size:.79rem;white-space:nowrap;
  font-variant-numeric:tabular-nums}
/* the event row spans the table and must wrap, not stretch it */
td[colspan]{white-space:normal;overflow-wrap:anywhere;max-width:0;width:100%}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{background:#f0f4fa;font-weight:620;position:sticky;top:0;font-size:.74rem}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}
th:first-child{background:#f0f4fa;z-index:2}
tbody tr:hover td{background:#f7fafd}
tbody tr:hover td:first-child{background:#f7fafd}
tr.evt td{background:var(--warn-bg)!important;font-weight:600}
tr.ret td{border-top:2px solid var(--gold)}

/* ---------- results ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin:16px 0;
  align-items:stretch}
.kpi{display:flex;flex-direction:column;justify-content:space-between}
.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px}
.kpi .k{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:1.4rem;font-weight:680;margin-top:3px}
.kpi.dark{background:var(--brand);border-color:var(--brand)}
.kpi.dark .k{color:#b8cde4} .kpi.dark .v{color:#fff}
.miles{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px}
.mile{flex:0 0 128px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;text-align:center}
.mile .a{font-weight:680;font-size:.95rem} .mile .ph{font-size:.68rem;color:var(--muted);margin:1px 0 6px}
.mile .v{color:var(--brand2);font-weight:680}
.mile.r{border-color:var(--gold);background:var(--gold-l)}

/* ---------- self test ---------- */
.tst{display:flex;gap:9px;align-items:center;font-size:.79rem;padding:5px 9px;border-radius:6px;margin-bottom:4px}
.tst.p{background:var(--ok-bg)} .tst.f{background:var(--bad-bg)}
.tst .n{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:.74rem}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:640}
.badge.p{background:var(--ok-bg);color:var(--ok)} .badge.f{background:var(--bad-bg);color:var(--bad)}

/* ---------- affixed inputs ---------- */
.affix{position:relative;display:flex;align-items:center}
.affix input{padding-left:26px}
.affix.pct input{padding-left:10px;padding-right:28px}
.affix::before{position:absolute;left:10px;color:var(--muted);font-size:.85rem;pointer-events:none;z-index:1}
.affix.money::before{content:'$'}
.affix.pct::after{content:'%';position:absolute;right:10px;color:var(--muted);font-size:.85rem;pointer-events:none}
.affix.money input,.affix.pct input{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- progress ring ---------- */
.pstep{display:inline-flex;align-items:center;gap:6px}
.ring{width:13px;height:13px;border-radius:50%;border:2px solid currentColor;flex:0 0 auto;position:relative}
.ring.full{background:currentColor}
.ring.part::after{content:'';position:absolute;inset:1px;border-radius:50%;
  background:conic-gradient(currentColor var(--p,0%),transparent 0)}

/* ---------- notes ---------- */

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:9px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin:8px 0 0}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- validation ---------- */
.f.err input,.f.err select{border-color:var(--bad);background:#fffafa}
.f .emsg{font-size:.73rem;color:var(--bad);font-weight:560}

/* ---------- sticky action bar ---------- */
.nav{position:sticky;bottom:0;z-index:30;background:#fff;
  box-shadow:0 -2px 12px rgba(16,32,56,.07)}

.hide{display:none!important}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 13px;border:none;background:none;color:var(--muted);font-size:.86rem;font-weight:560;
  border-bottom:2px solid transparent;border-radius:0}
.tab.on{color:var(--brand);border-bottom-color:var(--gold)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:8px;font-size:.84rem;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}

@media print{
  header,.prog,.nav,.hactions,#selftest,.tabs{display:none!important}
  main{grid-template-columns:1fr;padding:0;max-width:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tw{overflow:visible}
  .card{break-inside:avoid;box-shadow:none;border-color:#ccc}
  body{background:#fff}
}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div>
      <div class="tag">Your Tax Line™ Wealth Engineering</div>
      <h1>Roadmap to Age 90™</h1>
      <p class="hsub">Client intake and lifetime projection to age 90 or 100.</p>
    </div>
    <div class="hactions">
      <button class="btn-ghost btn-sm" id="btnDemo">Load demo</button>
      <button class="btn-ghost btn-sm" id="btnReset">Reset</button>
    </div>
  </div>
</header>

<div class="prog">
  <div class="pwrap" id="progSteps"></div>
  <div class="pbar"><i id="progBar" style="width:0"></i></div>
</div>

<main>
  <div>
    <div id="wizard"></div>
    <div class="nav card" style="margin-bottom:16px">
      <button class="btn-sec" id="btnBack">← Back</button>
      <button id="btnNext">Next →</button>
      <button class="btn-gold hide" id="btnRun">Run projection →</button>
      <span class="sp" id="navInfo"></span>
    </div>
    <div id="results"></div>
    <!-- <div id="selftest"></div> -->
  </div>

</main>


<div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   PART A — 2026 CONSTANTS.  Single source of truth.
   Every figure verified against the primary US government source.
   Cross-checked against research/10-SOURCES-AND-COMPETITORS.md
   ========================================================================== */
const C = Object.freeze({
  YEAR: 2026,

  /* Brackets — IRS Rev. Proc. 2025-32 */
  BRACKETS: {

  /* Long-term capital gains — Rev. Proc. 2025-32 */
  LTCG: {
    single:[[49450,0],[545500,.15],[Infinity,.20]],
    mfj:   [[98900,0],[613700,.15],[Infinity,.20]],
    mfs:   [[49450,0],[306850,.15],[Infinity,.20]],
    hoh:   [[66200,0],[579600,.15],[Infinity,.20]],
    qss:   [[98900,0],[613700,.15],[Infinity,.20]]
  },

  /* OBBBA senior bonus deduction — 2025-2028 ONLY */
  /* §151(d)(5)(C): $6,000 per QUALIFIED individual (each must be 65+).
     MFS is DENIED entirely by (v). Amounts are NOT indexed - the provision expires. */

            'financial_services','brokerage','investing','trading','reputation'],

            'wholesale','restaurant','transport','software','insurance_agency','farming','other'],

        addlThr:{single:200000,mfj:250000,mfs:125000,hoh:200000,qss:250000}},
  SE:{factor:.9235, ssRate:.124, medRate:.029},

  /* Social Security — Federal Register 2025-19763 */
  SS:{bend1:1286, bend2:7749, r1:.90, r2:.32, r3:.15, cola:.028,
      awi2024:69846.57, awi1977:9779.44, base1:180, base2:1085,
      fra:67, maxMonthlyFRA:4152,
      taxThr:{single:[25000,34000],mfj:[32000,44000],mfs:[0,0],hoh:[25000,34000],qss:[32000,44000]},

       83:17.7,84:16.8,85:16.0,86:15.2,87:14.4,88:13.7,89:12.9,90:12.2,91:11.5,92:10.8,93:10.1,
       94:9.5,95:8.9,96:8.4,97:7.8,98:7.3,99:6.8,100:6.4,101:6.0,102:5.6,103:5.2,104:4.9,105:4.6,
       106:4.3,107:4.1,108:3.9,109:3.7,110:3.5,111:3.4,112:3.3,113:3.1,114:3.0,115:2.9,116:2.8,
       117:2.7,118:2.5,119:2.3,120:2.0},
  QCD:111000,

  /* Retirement limits — IRS Notice 2025-67 */
  LIM:{d401k:24500, cu50:8000, cu6063:11250, ira:7500, iraCU:1100,
       simple:17000, simpleCU:4000, rothCatchUpWageTrigger:150000,
       rothIRA:{single:[153000,168000],mfj:[242000,252000],mfs:[0,10000],
                hoh:[153000,168000],qss:[242000,252000]}},

  /* §164(b)(7) as added by OBBBA - a SCHEDULE, not a CPI-indexed figure */
  SALT:{y2025:40000, y2026:40400, growth:1.01, lastScheduledYear:2029,
        revertYear:2030, revertAmt:10000,
        phaseThr2026:505000, phaseGrowth:1.01, phaseRate:.30, floor:10000},

  /* §170(b)(1)(I) 0.5% floor on itemised giving; §170(p) non-itemiser deduction */

  /* §68 as rewritten by OBBBA - 2/37 of the lesser of itemised or the excess
