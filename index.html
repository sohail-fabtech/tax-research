/* ==========================================================================
   PART C — ENGINE.  Implements the 22-step year loop from research/MASTER-GUIDE.md
   Computed NOMINAL throughout; deflated once at step 20.
   ========================================================================== */
/* Scenario presets — identical to PRESET_SCENARIOS in tax-be/src/controllers/taxRoadmapController.js */
const SCENARIOS={
  conservative:{incomeGrowth:2.0, retirementReturn:5.0, realEstateReturn:3.5, inflation:0,  strategyEffectiveness:80},
  expected:    {incomeGrowth:3.0, retirementReturn:7.0, realEstateReturn:5.0, inflation:3,  strategyEffectiveness:100},
  accelerated: {incomeGrowth:4.0, retirementReturn:9.0, realEstateReturn:6.5, inflation:0,  strategyEffectiveness:125}
};
const N=x=>{const v=parseFloat(String(x??'').replace(/[$,\s%]/g,''));return isFinite(v)?v:0;};
const R=x=>Math.round(x);
/* Default ONLY when the field is blank.  `N(x)||d` silently overrides a deliberate
   zero — a client who sets 0% inflation was being given 2.5%. */
const NUM=(v,d)=>{const s=String(v??'').trim(); if(s==='')return d;
                  const n=N(s); return isFinite(n)?n:d;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const yrOf=d=>d?new Date(d).getFullYear():0;
const ageOn=(dob,y)=>dob?y-yrOf(dob):0;

/* --- Step 11: the bracket walk. Never multiply by the marginal rate --- */
function bracketTax(ti,tbl,infl){
  let t=0,prev=0; if(ti<=0)return 0;
  for(const[cap,rate]of tbl){
    const c=cap===Infinity?Infinity:cap*infl;
    const slice=Math.min(ti,c)-prev; if(slice<=0)break;
    t+=slice*rate; prev=c;
  } return t;
}
/* --- Capital gains STACK on top of ordinary income --- */
function ltcgTax(ordinary,gains,tbl,infl){
  if(gains<=0)return 0;
  let t=0,pos=ordinary,left=gains,prev=0;
  for(const[cap,rate]of tbl){
    const c=cap===Infinity?Infinity:cap*infl;
    const room=Math.max(0,c-Math.max(pos,prev));
    const use=Math.min(left,room);
    if(use>0){t+=use*rate;left-=use;pos+=use;}
    prev=c; if(left<=0)break;
  } return t;
}
/* --- Step 4: PIA from AIME, 2026 bend points --- */
function pia(aime){
  const p=C.SS.r1*Math.min(aime,C.SS.bend1)
        + C.SS.r2*Math.max(0,Math.min(aime,C.SS.bend2)-C.SS.bend1)
        + C.SS.r3*Math.max(0,aime-C.SS.bend2);
  return Math.floor(p*10)/10;                       // round DOWN to the dime
}
function bendPoints(awi){return{b1:Math.round(C.SS.base1*awi/C.SS.awi1977),
                                b2:Math.round(C.SS.base2*awi/C.SS.awi1977)};}
/* --- Spousal benefit: up to 50% of the WORKER's PIA, anchored to PIA regardless of
       what the worker actually claims.  Its own reduction curve (25/36 of 1% for the
       first 36 months, then 5/12 of 1%).  Delayed credits NEVER apply to spousal. --- */
function spousalFactor(claimAge,fra){
  if(claimAge>=fra)return 0.50;                       // no DRCs on spousal
  const m=Math.round((fra-claimAge)*12);
  const red=(25/36/100)*Math.min(m,36)+(5/12/100)*Math.max(0,m-36);
  return 0.50*(1-red);                                // 62 w/ FRA 67 -> 32.5% of PIA
}
/* --- Retirement earnings test.  Withheld benefits are restored at FRA --- */
function earningsTest(benefit,earnings,age,fra,infl){
  if(benefit<=0||earnings<=0||age>=fra)return{paid:benefit,withheld:0};
  const reachesFRAThisYear=(fra-age)<1;
  const lim=(reachesFRAThisYear?C.SS.earnTestNRAMo:C.SS.earnTestMo)*12*infl;
  const rate=reachesFRAThisYear?3:2;
  const withheld=Math.min(benefit,Math.max(0,earnings-lim)/rate);
  return{paid:benefit-withheld,withheld};
}
/* --- Claiming adjustment: -5/9 of 1% first 36 months, then -5/12; +2/3 of 1% delayed --- */
function claimAdj(claimAge,fra){
  if(claimAge<fra){
    const m=Math.round((fra-claimAge)*12);
    const red=(5/9/100)*Math.min(m,36)+(5/12/100)*Math.max(0,m-36);
    return 1-red;
  }
  const m=Math.round((Math.min(claimAge,70)-fra)*12);
  return 1+(2/3/100)*m;
}
/* --- Step 10: taxable Social Security. Thresholds NEVER indexed --- */
function taxableSS(benefit,other,taxExempt,thr){
  if(benefit<=0)return 0;
  const[t1,t2]=thr, prov=other+taxExempt+0.5*benefit;
  if(prov<=t1)return 0;
  if(prov<=t2)return Math.min(0.5*(prov-t1),0.5*benefit);
  return Math.min(0.85*(prov-t2)+Math.min(0.5*(t2-t1),0.5*benefit),0.85*benefit);
}
/* --- Step 5: RMD --- */
function rmdAgeFor(birthYear){return birthYear>=1960?75:birthYear>=1951?73:72;}
function ultDiv(age){return C.ULT[clamp(Math.round(age),72,120)]||C.ULT[120];}
/* --- Step 3: catch-up REPLACES, never stacks --- */
function catchUp(age){return(age>=60&&age<=63)?C.LIM.cu6063:(age>=50?C.LIM.cu50:0);}
function limit401k(age,infl){return(C.LIM.d401k+catchUp(age))*infl;}

/* --- Step 12: QBI with the SSTB phase-out --- */
function qbiDeduction(qbi,taxableBefore,netCapGain,isSSTB,fs,infl,w2,ubia,activeQbi){
  /* §199A(i), OBBBA §70105: where aggregate ACTIVE qualified business income is at
     least $1,000, the deduction is the GREATER of the computed amount or $400. */
  const floor=(activeQbi&&qbi>=C.QBI.minQbi)?C.QBI.min:0;
  if(qbi<=0)return floor;
  const thr=C.QBI.thr[fs]*infl, end=C.QBI.end[fs]*infl;
  const cap=C.QBI.rate*Math.max(0,taxableBefore-netCapGain);
  if(taxableBefore<=thr)return Math.max(floor,Math.min(C.QBI.rate*qbi,cap));
  const phase=clamp((taxableBefore-thr)/(end-thr),0,1);
  if(isSSTB){
    if(phase>=1)return floor;                             // fully phased out
    const applic=1-phase;
    return Math.max(floor,Math.min(C.QBI.rate*qbi*applic,cap*applic));
  }
  // non-SSTB: W-2 wage / UBIA limit phases in
  const wageLimit=Math.max(0.50*w2,0.25*w2+0.025*ubia);
  const full=C.QBI.rate*qbi;
  const limited=Math.min(full,wageLimit);
  return Math.max(floor,Math.min(full-(full-limited)*phase,cap));
}
/* --- Step 13: NIIT. Thresholds frozen since 2013 --- */
function niitOf(nii,magi,fs){
  const t=C.NIIT.thr[fs];
  return C.NIIT.rate*Math.min(Math.max(0,nii),Math.max(0,magi-t));
}
/* --- Step 14: AMT parallel rail --- */
function amtOf(amti,fs,regularTax,infl){
  const base=C.AMT.ex[fs]*infl, po=C.AMT.po[fs]*infl, brk=C.AMT.brk*infl;
  const ex=Math.max(0,base-C.AMT.poRate*Math.max(0,amti-po));
  const b=Math.max(0,amti-ex);
  const tmt=C.AMT.r26*Math.min(b,brk)+C.AMT.r28*Math.max(0,b-brk);
  return{tmt,exemption:ex,base:b,due:Math.max(0,tmt-regularTax)};
}
/* --- Step 7f: IRMAA. Uses MAGI from TWO YEARS prior. A cliff, not a phase-in --- */
function irmaaOf(magi2yr,fs,people){
  const joint=['mfj','qss'].includes(fs);
  let row=C.MEDICARE.tiers[0];
  for(const t of C.MEDICARE.tiers){ if(magi2yr>(joint?t.j:t.s))row=t; }
  return(row.b+row.d)*12*(people||1);
}
/* --- Steps 6-9: the four gates.  Conservation identity is asserted --- */
function runGates(loss,basis,atRisk,isPassive,passiveIncome,allowance){
  const g1=Math.min(loss,Math.max(0,basis));           const sBasis=loss-g1;
  const g2=Math.min(g1,Math.max(0,atRisk));            const sAtRisk=g1-g2;
  let allowed=g2,sPassive=0;
  if(isPassive){ allowed=Math.min(g2,Math.max(0,passiveIncome+allowance)); sPassive=g2-allowed; }
  const ok=Math.abs((allowed+sBasis+sAtRisk+sPassive)-loss)<0.01;   // conservation
  return{allowed,sBasis,sAtRisk,sPassive,basisAfter:basis-g1,atRiskAfter:atRisk-g2,ok};
}
/* --- Step 18: amortisation --- */
function mortPayment(P,annRate,months){
  if(P<=0||months<=0)return 0; const i=annRate/12;
  if(i===0)return P/months;
  return P*(i*Math.pow(1+i,months))/(Math.pow(1+i,months)-1);
}
function mortBalance(P,annRate,months,paid){
  if(P<=0||months<=0)return 0; const i=annRate/12;
  if(i===0)return Math.max(0,P-(P/months)*paid);
  return Math.max(0,P*(Math.pow(1+i,months)-Math.pow(1+i,paid))/(Math.pow(1+i,months)-1));
}
/* --- Step 5b: property classification --- */
function classifyProperty(p){
  const rented=N(p.daysRented),personal=N(p.personalDays);
  const out={isRental:true,passive:true,blocked280A:false,reason:'',augusta:false};
  if(rented>0&&rented<=14){out.augusta=true;out.reason='Augusta rule §280A(g): ≤14 days rented — income excluded entirely';return out;}
  const thr=Math.max(C.RE.use280A,C.RE.use280Apct*rented);
  if(personal>thr){out.blocked280A=true;out.reason=`§280A: ${personal} personal days exceeds the ${R(thr)}-day threshold — deductions capped at rental income`;return out;}
  const avg=N(p.avgStay);
  const mp=(N(p.hours)>500)||(N(p.hours)>100&&N(p.hours)>N(p.otherHours))||p.selfManaged==='y'&&N(p.hours)>100;
  if(p.rentType==='str'&&avg>0&&avg<=C.RE.strDays){
    out.isRental=false;
    out.passive=!mp;
    out.reason=mp?`${avg}-day average stay + material participation → NON-PASSIVE, offsets ordinary income`
                 :`${avg}-day average stay → not a rental activity, but material participation not met → still passive`;
    return out;
  }
  out.reason='Rental activity → passive by default regardless of hours, unless a real estate professional';
  return out;
}
/* --- Cost of insurance: per $1,000 of net amount at risk, age-banded.
       Approximates a 2017 CSO-style curve; replaces the placeholder that had a
       cancelling /1000*1000 and a flat 0.4% inflating at 6%. --- */
function coiPer1000(age){
  if(age<30)return 0.9;  if(age<40)return 1.2;  if(age<50)return 2.4;
  if(age<55)return 4.2;  if(age<60)return 6.8;  if(age<65)return 11.0;
  if(age<70)return 18.5; if(age<75)return 31.0; if(age<80)return 52.0;
  if(age<85)return 88.0; if(age<90)return 148.0; if(age<95)return 240.0;
  return 380.0;
}
/* --- §203(a) family maximum.  Caps TOTAL benefits on one earnings record.
       The worker's own benefit is never reduced; auxiliaries absorb the cap. --- */
function famMax(pia){
  const F=C.FAMMAX;
  const t = F.r1*Math.min(pia,F.b1)
          + F.r2*Math.max(0,Math.min(pia,F.b2)-F.b1)
          + F.r3*Math.max(0,Math.min(pia,F.b3)-F.b2)
          + F.r4*Math.max(0,pia-F.b3);
  return Math.floor(t*10)/10;
}

/* --- Survivor FRA is NOT retirement FRA.  Separate schedule. --- */
function survFraFor(birthYear){
  if(birthYear<=1956)return 66;
  if(birthYear>=1962)return 67;
  return C.SURV_FRA[birthYear] ?? 67;
}

/* --- Survivor reduction: max 28.5% at 60, spread to survivor FRA.
       At survivor FRA 67 this is 19/56 of 1% a month. --- */
function survivorFactor(claimAge,survFra){
  if(claimAge>=survFra)return 1;
  const a=Math.max(60,claimAge);
  const totalMonths=Math.round((survFra-60)*12);
  const early=Math.round((survFra-a)*12);
  const perMonth=(1-C.SS.survivorAt60)/totalMonths;      // 0.285 / months
  return 1-perMonth*early;
}

/* --- RIB-LIM, POMS RS 00615.320.  The survivor benefit is LIMITED TO the
       larger of 82.5% of the deceased's PIA or what the deceased was entitled to.
       It is a CEILING; the 82.5% is a floor inside it. --- */
function ribLim(deceasedPIA,deceasedClaimAge,fra){
  const actual = deceasedPIA*claimAdj(deceasedClaimAge,fra);
  return Math.max(0.825*deceasedPIA, actual);
}

/* --- §164(b)(7): a SCHEDULE plus a 30% phasedown, not a CPI-indexed cap. --- */
function saltCapFor(year,magi,fs){
  const S=C.SALT, half=(fs==='mfs')?0.5:1;
  let base;
  if(year>=S.revertYear)      base=S.revertAmt;
  else if(year<=2025)         base=S.y2025;
  else if(year<=S.lastScheduledYear)
                              base=S.y2026*Math.pow(S.growth,year-2026);
  else                        base=S.revertAmt;
  base*=half;
  const floor=S.floor*half;
  if(year>=S.revertYear)return base;                     // no phasedown after reversion
  const thr=S.phaseThr2026*Math.pow(S.phaseGrowth,Math.max(0,year-2026))*half;
  const reduced=base-S.phaseRate*Math.max(0,magi-thr);
  return Math.max(floor,reduced);
}

/* --- §68 as rewritten by OBBBA.  Applied AFTER every other limitation. --- */
function sec68(itemized,taxableBefore68,fs,infl){
  if(itemized<=0)return 0;
  const tbl=C.BRACKETS[fs]||C.BRACKETS.single;
  const top37=tbl[tbl.length-2][0]*infl;                 // floor of the 37% band
  const increased=taxableBefore68+itemized;
  const excess=Math.max(0,increased-top37);
  const reduction=C.SEC68.frac*Math.min(itemized,excess);
  return itemized-reduction;
}

/* --- LTC premium cap by age --- */
function ltcCap(age){for(const[a,c]of C.LTC_CAP){if(age<=a)return c;}return 6200;}

/* ==========================================================================
   THE MAIN LOOP — one pass per year, steps 0 through 20 in order.
   ========================================================================== */
function project(s){
  const baseYear=N(s.taxPlanYear)||C.YEAR;
  const startAge=ageOn(s.dob,baseYear)||42;
  const birthYear=yrOf(s.dob)||(C.YEAR-startAge);
  const endAge=+(s.endAge||90);
  const retAge=NUM(s.retireAge,65);
  const infl=NUM(s.inflation,2.5)/100;
  const hcInfl=NUM(s.hcInflation,5)/100;
  const SC=SCENARIOS[s.scenario||'expected'];
  const gGrow=(s.scenario?SC.incomeGrowth:N(s.incomeGrowth))/100||.03;
  const rRet=((s.scenario?SC.retirementReturn:N(s.retReturn))/100||.065)-(N(s.advisoryFee)/100||0);
  const rTax=NUM(s.taxableReturn,5.75)/100;
  const rRE=(s.scenario?SC.realEstateReturn:N(s.reGrowth))/100||.035;
  const rmdAge=rmdAgeFor(birthYear);
  const heirRate=NUM(s.heirRate,35)/100;
  const retFactor=NUM(s.retExpenseFactor,85)/100;
  const survFactor=NUM(s.survivorFactor,75)/100;

  /* ---- opening carryforward state ---- */
  let fs=s.filingStatus||'single';
  const accounts=(s.accounts||[]);
  let pretax=0,roth=0,hsa=0;
  accounts.forEach(a=>{const b=N(a.balance);
    if(['t401k','tira','sep','simple','t403b','t457'].includes(a.type))pretax+=b;
    else if(['r401k','rira'].includes(a.type))roth+=b; else if(a.type==='hsa')hsa+=b;});
  let taxable=N(s.taxableBal);
  let taxableBasis=N(s.taxableBasis)||N(s.taxableBal);   /* tracked so withdrawals realise gain */
  let nol=N(s.nol), capST=N(s.capLossST), capLT=N(s.capLossLT);
  let negQBI=N(s.negQBI), amtCredit=N(s.amtCredit);
  let priorPretax=pretax;
  const magiHist={};

  const k1s=(s.k1s||[]).map(k=>({...k,
    _basis:N(k.basis)+N(k.debtBasis)+N(k.shareDebt),_atRisk:N(k.atRisk),
    _sB:N(k.suspBasis),_sA:N(k.suspAtRisk),_sP:N(k.suspPassive)}));
  const props=(s.props||[]).map(p=>{
    const price=N(p.price),land=N(p.land),bldg=Math.max(0,price-land);
    return{...p,_bldg:bldg,_cost:price||N(p.value),_bal:N(p.mortBal),_val:N(p.value)||price,
      _accum:N(p.accumDep),_sP:N(p.suspPassive),
      _basis:N(p.basis)||price,_atRisk:N(p.atRisk)||price,
      _pay:mortPayment(N(p.mortBal),N(p.mortRate)/100,N(p.mortTerm)),
      _mo:0,_orig:N(p.mortBal),_sold:false};});
  const pols=(s.policies||[]).map(p=>({...p,
    _cv:N(p.cashValue),_loan:N(p.loanBal),_basis:N(p.premiumsPaid),_lapsed:false}));

  /* ---------- Deployable Wealth Capital layer (mirrors tax-be) ---------- */
  const strat=(s.strategies||[]);
  /* a strategy contributes only in the years it is actually active, net of its cost */
  const stratInYear=y=>strat.reduce((t,x)=>{
    const a=N(x.startYear)||baseYear, b=N(x.endYear)||9999;
    if(y<a||y>b)return t;
    return t+N(x.federalTaxSavings)+N(x.stateTaxSavings)-N(x.investmentAmount);
  },0);
  const stratTotal=strat.reduce((t,x)=>t+N(x.federalTaxSavings)+N(x.stateTaxSavings),0);
  const netTaxSavings=stratTotal>0?stratInYear(baseYear):N(s.taxSavings);
  const effectiveness=(NUM(s.strategyEffectiveness,100))/100;
  const dwcPct=N(s.dwcPercent)/100;
  /* the formula printed on the roadmap: Net Tax Savings + DWC % x Qualified Deduction Base */
  const annualDWC=(netTaxSavings+dwcPct*N(s.qualifiedDeductionBase))*effectiveness;
  const allocRaw={retirement:N(s.bucketRetirement),insurance:N(s.bucketInsurance),
    realestate:N(s.bucketRealestate),liquidity:N(s.bucketLiquidity),
    legacy:N(s.bucketLegacy),disabilityLtc:N(s.bucketDisabilityLtc)};
  const allocSum=Object.values(allocRaw).reduce((a,b)=>a+b,0);
  const alloc={};Object.keys(allocRaw).forEach(k=>alloc[k]=allocSum>0?allocRaw[k]/allocSum:0);
  const costDrag=(N(s.adminFeeCost)+N(s.costOfInvestment))/100;
  const bucketRate={retirement:rRet-costDrag, insurance:(NUM(s.creditRate,5.5)/100)-costDrag,
    realestate:rRE-costDrag, liquidity:rTax-costDrag,
    legacy:rTax-costDrag, disabilityLtc:rTax-costDrag};
  let bucket={retirement:0,insurance:0,realestate:N(s.currentRealEstateValue),
              liquidity:N(s.cashOnHand),legacy:0,disabilityLtc:0};

  const rows=[],notes=[];
  let cumWithheldMonths=0, arfApplied=false, arfFactor=1, famMaxWarned=false, saleNoted=false;
  let widowed=false,divorced=false,ltcActive=false;

  for(let age=startAge;age<=endAge;age++){
    const n=age-startAge, year=baseYear+n, iAdj=Math.pow(1+infl,n);
    const working=age<retAge;
    const evts=[];

    /* ---------- STEP 0 — life events ---------- */
    if(s.modelDeath==='y'&&age===N(s.deathAge)){
      widowed=true;                       /* status stays MFJ for the ENTIRE year of death */
      evts.push('Spouse died — filing status stays MFJ for this year (IRC §2)');
      notes.push({t:'b',y:year,m:`Age ${age}: filing status changes for the survivor. Tax rises even though income falls.`});
    }
    if(widowed&&age>N(s.deathAge)){
      const yrsSince=age-N(s.deathAge);
      const nf=(s.hasDepChild==='y'&&yrsSince<=2)?'qss':'single';
      if(nf!==fs){fs=nf;evts.push('Filing status → '+(nf==='qss'?'Qualifying Surviving Spouse':'Single'));}
    }
    if(s.modelDivorce==='y'&&age===N(s.divorceAge)){divorced=true;fs='single';evts.push('Divorce — filing status → Single');}
    if(s.expectLTC==='y'&&age>=N(s.ltcStartAge)&&age<N(s.ltcStartAge)+N(s.ltcYears)){
      if(!ltcActive){evts.push('Long-term care begins');ltcActive=true;
        notes.push({t:'w',y:year,m:`Age ${age}: long-term care begins. Large medical costs also mean a large deduction this year.`});}
    } else ltcActive=false;
    let windfall=0,windfallBasisAmt=0,windfallQSBS=false;
    if(s.modelWindfall==='y'&&age===N(s.windfallAge)){
      windfall=N(s.windfallAmt);windfallBasisAmt=N(s.windfallBasis);
      windfallQSBS=s.windfallQSBS==='y';
      evts.push('One-time windfall '+money(windfall));
      notes.push({t:'w',y:year,m:`Age ${age}: windfall of ${money(windfall)}. ${windfallQSBS?'Qualifying gain does not affect Medicare premiums.':'Medicare premiums rise two years later.'}`});
    }
    const married=['mfj','mfs'].includes(fs);
    const people65=(age>=65?1:0)+((married&&!widowed)?(ageOn(s.spouseDob,year)>=65?1:0):0);

    /* ---------- STEP 1 — income ---------- */
    let w2=0,bizProfit=0;
    if(working){
      w2=(N(s.w2)+(widowed?0:N(s.spouseW2))+N(s.bonusComp))*Math.pow(1+gGrow,n);
      bizProfit=N(s.bizProfit)*Math.pow(1+gGrow,n);
    } else if(s.workPartTime==='y'&&age<=N(s.ptUntilAge)){
      w2=N(s.ptIncome)*Math.pow(1+gGrow,n);
    }
    const otherInc=N(s.otherIncome)*Math.pow(1+gGrow,n);

    /* ---------- STEP 2 — expenses ---------- */
    let gen=N(s.monthlyExpenses)*12*Math.pow(1+infl,n);
    if(!working)gen*=retFactor;
    if(widowed)gen*=survFactor;
    let health=N(s.monthlyMedical)*12*Math.pow(1+hcInfl,n);
    const ltcCost=ltcActive?N(s.ltcAnnualCost)*Math.pow(1+hcInfl,n):0;

    /* ---------- STEP 3 — contributions ---------- */
    let pretaxContrib=0,rothContrib=0;
    if(working){
      const lim=limit401k(age,iAdj);
      const want=accounts.reduce((t,a)=>t+N(a.contrib)+N(a.employerMatch),0)*Math.pow(1+infl,n);
      const total=Math.min(want,lim,Math.max(0,w2));
      const cuMustBeRoth=N(s.priorYearWages)>C.LIM.rothCatchUpWageTrigger;
      const cu=catchUp(age)*iAdj;
      if(cuMustBeRoth&&total>0){rothContrib=Math.min(cu,total);pretaxContrib=total-rothContrib;}
      else if(s.contribStrategy==='roth'){rothContrib=total;}
      else if(s.contribStrategy==='split'){rothContrib=total/2;pretaxContrib=total/2;}
      else pretaxContrib=total;
    }

    /* ---------- STEP 4 — Social Security ----------
       §215(i): COLAs accrue from the year the worker attains 62, NOT from the
       claiming age.  A claim-at-70 benefit already carries 8 years of increases. */
    let ss=0;
    const claim=+(s.ssClaimAge||67);
    const basePIA=s.ssSource==='stmt'?N(s.ssAtFRA):pia(N(s.aime)||(N(s.w2)/12*0.35));
    const spousePIA=N(s.spouseSsAtFRA);
    const spClaim=+(s.spouseClaimAge||67);
    const survFra=survFraFor(birthYear);
    let ssWithheld=0, ssGross=0;
    if(age>=claim&&(basePIA>0||spousePIA>0)){
      const colaOwn=Math.pow(1+C.SS.cola,Math.max(0,age-62));      /* from 62, not claim */
      const own=basePIA*claimAdj(claim,C.SS.fra)*12*colaOwn;

      /* Auxiliary benefits on THIS record, before the §203(a) family maximum */
      let sp=0, childTotal=0, auxUnreduced=0;
      /* A spousal benefit requires an actual spouse.  Without the married test a
         single filer was credited 50% of their own PIA as a phantom spousal benefit. */
      if(married&&!widowed&&age>=spClaim){
        const spOwn=spousePIA*claimAdj(spClaim,C.SS.fra);
        const spSpousal=basePIA*spousalFactor(spClaim,C.SS.fra);
        sp=Math.max(spOwn,spSpousal)*12*Math.pow(1+C.SS.cola,Math.max(0,age-62));
        if(spSpousal>spOwn)auxUnreduced+=spSpousal*12*Math.pow(1+C.SS.cola,Math.max(0,age-62));
      }
      /* §202(d)(2) children's benefits — 50% of PIA living, 75% surviving */
      const kids=N(s.depChildren), kidAgeNow=N(s.youngestChildAge);
      if(kids>0&&basePIA>0){
        const kidAgeThen=kidAgeNow+n;
        if(kidAgeThen<C.CHILD.ageOut){
          const rate=widowed?C.CHILD.survivor:C.CHILD.living;
          childTotal=kids*basePIA*rate*12*Math.pow(1+C.SS.cola,Math.max(0,age-62));
          auxUnreduced+=childTotal;
        }
      }
      /* §203(a) family maximum — caps the TOTAL on one record.  The worker's own
         benefit is never reduced; auxiliaries are cut proportionately. */
      let famCut=0;
      if(auxUnreduced>0){
        const fmAnnual=famMax(basePIA)*12*Math.pow(1+C.SS.cola,Math.max(0,age-62));
        const room=Math.max(0,fmAnnual-(widowed?0:own));
        if(auxUnreduced>room){
          const factor=room/auxUnreduced;
          famCut=auxUnreduced-room;
          if(sp>0&&!widowed)sp*=factor;
          childTotal*=factor;
          if(!famMaxWarned){famMaxWarned=true;
            notes.push({t:'w',y:year,m:`Age ${age}: the family maximum caps benefits on this record. ${money(famCut)} of spouse and children's benefits is not payable.`});}
        }
      }

      if(widowed){
        /* Survivor: the HIGHER of the two, never both.  The survivor benefit is
           capped by RIB-LIM and reduced for claiming before SURVIVOR FRA. */
        const cap=ribLim(spousePIA,spClaim,C.SS.fra);
        const survivorBen=cap*survivorFactor(Math.max(60,age),survFra)*12
                          *Math.pow(1+C.SS.cola,Math.max(0,age-62));
        ss=Math.max(own,survivorBen)+childTotal;
      } else ss=own+sp+childTotal;

      ssGross=ss;
      /* Earnings test — only earned income, only before FRA */
      const et=earningsTest(ss,w2,age,C.SS.fra,iAdj);
      ss=et.paid; ssWithheld=et.withheld;
      cumWithheldMonths+=(ssGross>0? (et.withheld/ssGross)*12 : 0);
      if(et.withheld>0&&!rows.some(r=>r.ssWithheld>0))
        notes.push({t:'i',y:year,m:`Age ${age}: ${money(et.withheld)} of Social Security is withheld because of earnings. It is restored at full retirement age.`});
      /* §203, 20 CFR 404.430 — at FRA the benefit is recomputed upward for the
         months withheld, by treating the claim as that many months later. */
      if(age>=C.SS.fra&&cumWithheldMonths>0&&!arfApplied){
        arfApplied=true;
        const effClaim=Math.min(C.SS.fra,claim+cumWithheldMonths/12);
        arfFactor=claimAdj(effClaim,C.SS.fra)/claimAdj(claim,C.SS.fra);
        notes.push({t:'i',y:year,m:`Age ${age}: benefits withheld earlier are restored — the benefit rises ${((arfFactor-1)*100).toFixed(1)}% for life.`});
      }
      if(arfApplied)ss*=arfFactor;
    }

    /* ---------- STEP 5 — RMD (prior 31 Dec balance) ---------- */
    let rmd=0;
    if(age>=rmdAge&&priorPretax>0){rmd=priorPretax/ultDiv(age);
      if(age===rmdAge)notes.push({t:'i',y:year,m:`Age ${age}: required withdrawals begin at ${money(rmd)}. This is taxable income.`});}

    /* ---------- STEP 5b + 6-9 — property classification then the four gates ---------- */
    let reIncome=0,reAllowedLoss=0,reNonPassive=0,gateFail=false,k1CapGain=0;
    let passivePool=0,passiveIncome=0,nonPassiveBiz=0;
    /* disposition results for this year */
    let saleOrdinary=0,saleUnrecap=0,saleLTCG=0,saleProceeds=0,releasedPAL=0;
    props.forEach(p=>{
      if(p._sold)return;
      /* ---------- DISPOSITION ----------
         On sale: compute the gain, split it into §1245 ordinary recapture,
         unrecaptured §1250 gain (25% ceiling) and §1231 gain, release the
         suspended passive losses under §469(g), and pay the net proceeds
         into the taxable account.  None of this happened before. */
      if(N(p.sellAge)&&age>=N(p.sellAge)){
        const amountRealised=p._val*(1-C.RE.sellCost);
        const adjBasis=Math.max(0,p._cost-p._accum);
        const gain=amountRealised-adjBasis;
        if(gain>0){
          /* Personal property and land improvements recapture as ORDINARY income
             under §1245 to the extent of depreciation taken on them. */
          const segShare=(N(p.segPct5)+N(p.segPct15))/100;
          const dep1245=Math.min(p._accum*segShare,gain);
          const dep1250=Math.min(Math.max(0,p._accum-dep1245),Math.max(0,gain-dep1245));
          const s1231 =Math.max(0,gain-dep1245-dep1250);
          saleOrdinary+=dep1245;         /* taxed at ordinary rates */
          saleUnrecap +=dep1250;         /* §1(h)(1)(E) — 25% ceiling */
          saleLTCG    +=s1231;           /* ordinary long-term rates */
        } else {
          saleLTCG+=gain;                /* a loss on disposition */
        }
        /* §469(g): a fully taxable disposition of the ENTIRE interest frees the
           suspended passive losses and they become NON-passive. */
        if(p._sP>0){releasedPAL+=p._sP; p._sP=0;}
        /* Net cash after paying off the mortgage reaches the taxable account. */
        saleProceeds+=Math.max(0,amountRealised-p._bal);
        if(!saleNoted){saleNoted=true;
          notes.push({t:'i',y:year,m:`Age ${age}: property sold. Gain of ${money(Math.max(0,gain))} is taxed, suspended losses are released, and ${money(Math.max(0,amountRealised-p._bal))} of net proceeds moves to your taxable account.`});}
        p._sold=true;return;
      }
      const cls=classifyProperty(p);
      const rent=N(p.rentIncome)*Math.pow(1+infl,n);
      const exp=N(p.expenses)*Math.pow(1+infl,n);
      let dep=0;
      if(p._bldg>0&&n<40){
        const life=p.kind==='commercial'?C.RE.nonresid:C.RE.resid;
        if(p.costSeg==='y'&&n===0){
          const p5=p._bldg*N(p.segPct5)/100,p15=p._bldg*N(p.segPct15)/100;
          dep=(p5+p15)*C.RE.bonus+(p._bldg-p5-p15)/life;
        } else dep=p._bldg/life;
      }
      p._accum+=dep;
      const net=rent-exp-dep;
      if(cls.augusta)return;
      if(cls.blocked280A){ reIncome+=Math.max(0,rent-exp); return; }
      /* §1.469-2(f)(6) self-rental: net INCOME is recharacterised as non-passive,
         so it cannot absorb other passive losses.  A net LOSS remains passive. */
      const selfRental=(p.selfRental==='y');
      if(net>=0){
        if(cls.passive&&!selfRental)passiveIncome+=net; else reNonPassive+=net;
        reIncome+=net;
      }
      else{
        const g=runGates(-net,p._basis,p._atRisk,cls.passive,0,0);
        if(!g.ok)gateFail=true;
        p._basis=g.basisAfter;p._atRisk=g.atRiskAfter;p._sP+=g.sPassive;
        if(cls.passive)passivePool+=g.allowed+g.sPassive; else reNonPassive-=g.allowed;
      }
      /* real estate roll-forward (step 18) */
      p._val*=(1+rRE);
      if(p._bal>0){p._mo+=12;p._bal=mortBalance(p._orig,N(p.mortRate)/100,N(p.mortTerm),p._mo);}
    });
    k1s.forEach(k=>{
      const ord=N(k.ordinary)*Math.pow(1+gGrow,n);
      const isPassive=k.mp!=='y';
      if(ord>=0){ k._basis+=ord; k._atRisk+=ord;
        if(isPassive)passiveIncome+=ord; else nonPassiveBiz+=ord; }
      else{
        const g=runGates(-ord,k._basis,k._atRisk,isPassive,0,0);
        if(!g.ok)gateFail=true;
        k._basis=g.basisAfter;k._atRisk=g.atRiskAfter;
        k._sB+=g.sBasis;k._sA+=g.sAtRisk;k._sP+=g.sPassive;
        if(isPassive)passivePool+=g.allowed+g.sPassive; else nonPassiveBiz-=g.allowed;
      }
      passiveIncome+=N(k.portfolio);
      /* K-1 rental is passive by default; K-1 capital gain flows to the gains rail */
      const kr=N(k.rental)*Math.pow(1+gGrow,n);
      if(kr>0)passiveIncome+=kr; else if(kr<0)passivePool+=-kr;
      k1CapGain+=N(k.capGain)*Math.pow(1+gGrow,n);
    });
    /* Gate 3 — pool passive losses against passive income + the $25,000 allowance */
    const magiForAllow=w2+bizProfit+otherInc;
    const allowance=Math.max(0,C.ALLOW25K.amt-C.ALLOW25K.rate*Math.max(0,magiForAllow-C.ALLOW25K.start));
    const passiveAllowed=Math.min(passivePool,passiveIncome+allowance);
    const passiveSusp=passivePool-passiveAllowed;
    /* Gate 4 — excess business loss */
    const bizNet=bizProfit+nonPassiveBiz+reNonPassive;
    let ebl=0;
    if(bizNet<0){ const cap=C.EBL[fs]*iAdj;
      ebl=Math.max(0,-bizNet-cap);
      if(ebl>0){nol+=ebl;
        if(!rows.some(r=>r.ebl))notes.push({t:'w',y:year,m:`Age ${age}: business loss exceeds the annual cap of ${money(cap)}. ${money(ebl)} carries forward to later years.`});}
    }
    const bizAllowed=bizNet<0?bizNet+ebl:bizNet;

    /* ---------- payroll + self-employment tax ----------
       Computed BEFORE AGI because half the SE tax is an above-the-line deduction. */
    let payroll=0,seDeductible=0;
    if(w2>0){payroll+=Math.min(w2,C.FICA.wageBase*iAdj)*C.FICA.ss+w2*C.FICA.med
             +Math.max(0,w2-C.FICA.addlThr[fs])*C.FICA.addl;}
    /* Sole proprietors AND general partners owe SE tax.
       S-corp shareholders do NOT owe it on K-1 income. */
    let seIncome=0;
    if(s.entity==='sole'&&bizProfit>0)seIncome+=bizProfit;
    k1s.forEach(k=>{if(k.etype==='part'&&k.mp==='y'){
      const o=N(k.ordinary)*Math.pow(1+gGrow,n); if(o>0)seIncome+=o;}});
    if(seIncome>0){
      const b=seIncome*C.SE.factor;
      const wageRoom=Math.max(0,C.FICA.wageBase*iAdj-w2);
      const seTax=Math.min(b,wageRoom)*C.SE.ssRate+b*C.SE.medRate;
      /* §1401(b)(2): the 0.9% additional tax reaches SE income as well as wages,
         against ONE threshold shared with wages (wages counted first). */
      const addlRoom=Math.max(0,C.FICA.addlThr[fs]-w2);
      const seAddl=Math.max(0,b-addlRoom)*C.FICA.addl;
      payroll+=seTax+seAddl;
      seDeductible=seTax*0.5;   /* §164(f) excludes the §1401(b)(2) tax */
    }

    /* ---------- STEP 10 — AGI ---------- */
    const portfolioInc=N(s.taxableYield)*Math.pow(1+infl,n);
    /* Tax-exempt interest: excluded from income, but added back for BOTH the §86
       provisional income test and the 20 CFR §418.1010 Medicare MAGI. */
    const taxExemptInt=N(s.muniInterest)*Math.pow(1+infl,n);
    /* --- Realised capital gain on the taxable account ---
       The withdrawal depends on tax, and tax depends on the realised gain.  Resolved with
       ONE pre-pass: estimate the cash shortfall using the prior year's effective rate,
       realise the proportional gain, then compute tax once with that gain included.
       Deliberately not iterated to convergence — one pass is accurate to a few dollars. */
    let realizedGain=0;
    {
      const prevEff=rows.length?Math.min(.45,rows[rows.length-1].tax/Math.max(1,rows[rows.length-1].income)):.25;
      const grossIn=w2+bizAllowed+otherInc+ss+rmd+portfolioInc+reIncome+windfall;
      const estExp=gen+health+ltcCost+(age>=65?irmaaOf(magiHist[year-2]??grossIn,fs,(married&&!widowed)?2:1):0);
      const estNeed=estExp+grossIn*prevEff-grossIn;
      if(estNeed>0&&taxable>0){
        const take=Math.min(taxable,estNeed);
        const gainFrac=Math.max(0,1-taxableBasis/taxable);
        realizedGain=take*gainFrac;
      }
    }
    let capGain=Math.max(0,k1CapGain);
    if(windfall>0)capGain+=windfallQSBS?0:Math.max(0,windfall-windfallBasisAmt);
    /* Disposition: §1245 recapture and released §469(g) losses are ORDINARY;
       unrecaptured §1250 and §1231 gain are capital. */
    capGain+=Math.max(0,saleLTCG);

    /* ---------- Roth conversion ----------
       A fixed dollar amount is the crude way to do this.  What planning software
       actually does — and what this documentation teaches throughout — is fill the
       room to a CEILING: the top of an ordinary bracket, or the Medicare surcharge
       tier below the next one.  Both are supported.

       The room depends on taxable income, which depends on the conversion, so this
       uses ONE pre-pass on the same pattern as the realised-gain estimate above:
       assemble the year without the conversion, then convert exactly the room left.
       Not iterated to convergence — a second pass moves the answer by a few dollars. */
    let rothConv=0;
    if(s.rothConv==='y'&&!working&&age<rmdAge&&pretax>0){
      const mode=s.rothConvMode||'amount';
      if(mode==='amount'){
        rothConv=N(s.rothConvAmt);
      }else{
        const other0=w2+bizAllowed+otherInc+rmd+portfolioInc+reIncome
                     -passiveAllowed+capGain+realizedGain
                     +saleOrdinary+saleUnrecap-releasedPAL-seDeductible;
        const ssTax0=taxableSS(ss,other0,taxExemptInt,C.SS.taxThr[fs]||C.SS.taxThr.single);
        const agi0=Math.max(0,other0+ssTax0);
        if(mode==='irmaa'){
          /* IRMAA is a ceiling on MAGI (AGI + tax-exempt interest), and it is a
             CLIFF — stopping one dollar below a tier is the whole point. */
          const tier=Math.max(1,Math.min(5,+(s.rothConvTier||1)));
          const joint=['mfj','qss'].includes(fs);
          /* irmaaOf compares raw MAGI against the raw tier figures, so the target
             must use the SAME un-inflated ceiling or the client is pushed into the
             very tier they asked to stay below. */
          const ceil=(joint?C.MEDICARE.tiers[tier].j:C.MEDICARE.tiers[tier].s);
          rothConv=Math.max(0,ceil-(agi0+taxExemptInt)-1);
        }else{
          /* Ordinary bracket ceiling, measured on TAXABLE income.
             The senior deduction phases out against AGI, and AGI includes the
             conversion, so the room is a fixed point rather than a subtraction.
             Three passes converge to well under a dollar; overshooting the ceiling
             would put income in the very bracket the client asked to stay out of. */
          const target=+(s.rothConvBracket||22);
          const tbl=C.BRACKETS[fs]||C.BRACKETS.single;
          const hit=tbl.find(([,r])=>Math.round(r*100)===target);
          const ceil=hit?hit[0]*iAdj:Infinity;
          const dedAt=a=>{
            let d=(C.STD[fs]||C.STD.single)*iAdj+(C.ADD65[fs]||0)*people65*iAdj;
            if(year<=C.SENIOR.lastYear&&C.SENIOR.start[fs]!=null){
              let q=(age>=65?1:0);
              if(married&&!widowed&&ageOn(s.spouseDob,year)>=65)q++;
              if(q>0)d+=Math.max(0,C.SENIOR.amt*q-C.SENIOR.rate*Math.max(0,a-C.SENIOR.start[fs]));
            }
            return d;
          };
          for(let i=0;i<4;i++){
            const agiTry=agi0+rothConv;
            rothConv=Math.max(0,ceil-Math.max(0,agiTry-dedAt(agiTry))+rothConv);
          }
          /* Land just UNDER the ceiling.  A dollar over sits in the next bracket,
             which is the one the client asked to stay out of. */
          {const a=agi0+rothConv, over=Math.max(0,a-dedAt(a))-ceil;
           if(over>0)rothConv=Math.max(0,rothConv-over);}
        }
        const cap=N(s.rothConvMax);
        if(cap>0)rothConv=Math.min(rothConv,cap);
      }
      rothConv=Math.min(rothConv,Math.max(0,pretax));   /* cannot convert more than exists */
    }
    const otherForSS=w2+bizAllowed+otherInc+rmd+portfolioInc+reIncome
                     -passiveAllowed+rothConv+capGain+realizedGain
                     +saleOrdinary+saleUnrecap-releasedPAL-seDeductible;
    const ssTaxable=taxableSS(ss,otherForSS,taxExemptInt,C.SS.taxThr[fs]||C.SS.taxThr.single);
    let agi=otherForSS+ssTaxable;
    /* NOL — 80% limit */
    const nolUsed=Math.min(nol,C.NOL_LIMIT*Math.max(0,agi));nol-=nolUsed;agi-=nolUsed;
    /* capital loss — $3,000/yr, character preserved */
    const capAllow=C.CAP_LOSS[fs]||3000;
    const capUsed=Math.min(capST+capLT,capAllow);
    if(capUsed>0){const fromST=Math.min(capST,capUsed);capST-=fromST;capLT-=(capUsed-fromST);agi-=capUsed;}
    agi=Math.max(0,agi);
    magiHist[year]=agi+taxExemptInt;      /* 20 CFR §418.1010 */
    /* Medicare premiums for THIS year use MAGI from two years prior — compute now so the
       medical deduction below can include them (§213 allows Medicare premiums). */
    const irmaaPrior=age>=65?irmaaOf(magiHist[year-2]??agi,fs,(married&&!widowed)?2:1):0;

    /* ---------- STEP 11-12 — deductions, QBI, regular tax ---------- */
    let ded=(C.STD[fs]||C.STD.single)*iAdj+(C.ADD65[fs]||0)*people65*iAdj;
    /* §151(d)(5)(C) senior deduction.  $6,000 per QUALIFIED individual — each must
       be 65.  DENIED to married filing separately by (v).  Amounts NOT indexed. */
    if(year<=C.SENIOR.lastYear&&C.SENIOR.start[fs]!=null){
      let qualified=(age>=65?1:0);
      if(married&&!widowed&&ageOn(s.spouseDob,year)>=65)qualified++;
      if(qualified>0){
        const st=C.SENIOR.start[fs];                    // not inflated — no indexing
        ded+=Math.max(0,C.SENIOR.amt*qualified-C.SENIOR.rate*Math.max(0,agi-st));
      }
    }
    /* medical / LTC deduction above 7.5% of AGI — IRC §213 */
    const ltcPrem=Math.min(N(s.ltcPremium),ltcCap(age));
    const medTotal=health+ltcCost+ltcPrem+irmaaPrior;   /* Medicare premiums count — §213 */
    const medDed=(s.itemize==='y'||ltcCost>0)?Math.max(0,medTotal-C.MED_FLOOR*agi):0;
    const stdDed=ded;                                   // standard + age-65 + senior bonus
    /* §164(b)(7): scheduled amount, 30% phasedown, $10,000 floor, reverts 2030 */
    const saltCap=saltCapFor(year,agi,fs);
    const saltPaid=Math.min(saltCap,agi*(C.STATE[s.state]??0));
    /* §163(h) qualified residence interest and §170 charitable, less the 0.5% floor */
    const mortInt=N(s.mortgageInterest)*Math.pow(1+infl,n);
    const givingRaw=N(s.charitable)*Math.pow(1+infl,n);
    const giving=Math.max(0,givingRaw-C.CHAR_FLOOR*agi);   // §170(b)(1)(I)
    let itemized=medDed+saltPaid+mortInt+giving;
    /* §68 is applied AFTER every other limitation */
    itemized=sec68(itemized,Math.max(0,agi-itemized),fs,iAdj);
    const useItemized=itemized>stdDed;
    ded=useItemized?itemized:stdDed;
    /* §170(p): non-itemisers deduct up to $1,000 / $2,000 of CASH gifts */
    if(!useItemized&&givingRaw>0)
      ded+=Math.min(givingRaw,C.CHAR_NONITEM[fs]||C.CHAR_NONITEM.single);
    let tiBefore=Math.max(0,agi-ded);
    const isSSTB=C.SSTB_YES.includes(s.bizField);
    const qbiRaw=Math.max(0,bizAllowed)+negQBI;
    const qbiDed=qbiDeduction(Math.max(0,qbiRaw),tiBefore,capGain,isSSTB,fs,iAdj,
                              N(s.bizW2)*Math.pow(1+gGrow,n),N(s.bizUBIA),
                              s.bizMP!=='n');
    if(qbiRaw<0){negQBI=qbiRaw;} else negQBI=0;
    const ti=Math.max(0,tiBefore-qbiDed);
    /* §1(h) has FOUR components.  Unrecaptured §1250 gain is capped at 25% and is
       taxed at the lower of that ceiling and the taxpayer's own marginal rate. */
    const unrecapInTI=Math.min(saleUnrecap,ti);
    const totalGains=Math.max(0,capGain+realizedGain);
    const gainsInTI=Math.min(totalGains,Math.max(0,ti-unrecapInTI));
    const ordinaryTI=Math.max(0,ti-gainsInTI-unrecapInTI);
    const ordTax=bracketTax(ordinaryTI,C.BRACKETS[fs]||C.BRACKETS.single,iAdj);
    /* the 25% figure is a CEILING, not a flat rate */
    const marginalOnUnrecap=unrecapInTI>0
      ? (bracketTax(ordinaryTI+unrecapInTI,C.BRACKETS[fs]||C.BRACKETS.single,iAdj)-ordTax)/unrecapInTI
      : 0;
    const unrecapTax=unrecapInTI*Math.min(C.CG_CEIL.unrecap1250,marginalOnUnrecap);
    const fed=ordTax+unrecapTax
             +ltcgTax(ordinaryTI+unrecapInTI,gainsInTI,C.LTCG[fs]||C.LTCG.single,iAdj);

    /* ---------- payroll ---------- */
    /* payroll + SE tax were computed before AGI — see above */

    /* ---------- STEP 13 — NIIT (own income definition) ---------- */
    /* Net investment income has its OWN definition.  Passive business income counts;
       wages, self-employment income, Social Security and retirement distributions do not. */
    const netPassiveForNII=Math.max(0,passiveIncome-passiveAllowed);
    const nii=Math.max(0,portfolioInc+Math.max(0,capGain)+realizedGain+saleUnrecap+netPassiveForNII);
    const niit=niitOf(nii,agi,fs);

    /* ---------- STEP 14 — AMT (parallel rail) ----------
       Add back only what AMT disallows: the standard deduction, or SALT if itemising.
       Medical expenses ARE deductible for AMT (the AMT floor has matched the regular
       7.5% floor since 2019), so medDed is NOT added back. */
    const isoSpread=(working&&n===0)?N(s.isoSpread):0;
    const amtAddBack=useItemized?saltPaid:stdDed;
    const amti=Math.max(0,ti+qbiDed+amtAddBack+isoSpread);
    const A=amtOf(amti,fs,fed,iAdj);
    if(A.due>0){amtCredit+=A.due;
      if(!rows.some(r=>r.amt>0))notes.push({t:'w',y:year,m:`Age ${age}: alternative minimum tax of ${money(A.due)} applies, with a credit carried forward.`});}

    /* ---------- state ---------- */
    const stRate=C.STATE[s.state]??0;
    const stTaxesSS=C.STATE_TAXES_SS.includes(s.state);
    const stTI=Math.max(0,ti-(stTaxesSS?0:ssTaxable));
    const stateTax=stTI*stRate;

    /* ---------- IRMAA (MAGI from two years prior) ----------
       20 CFR §418.1010: MAGI here is AGI PLUS tax-exempt interest. */
    let irmaa=irmaaPrior;
    if(age>=65){const m2=magiHist[year-2]??(agi+taxExemptInt);
      irmaa=irmaaPrior;   /* already computed above, from the same two-year-prior MAGI */
      const joint=['mfj','qss'].includes(fs);
      const t1=joint?C.MEDICARE.tiers[1].j:C.MEDICARE.tiers[1].s;
      if(m2>t1&&!rows.some(r=>r.irmaa>C.MEDICARE.partB*12*2))
        notes.push({t:'w',y:year,m:`Age ${age}: Medicare surcharge applies, based on ${year-2} income of ${money(m2)}.`});
    }

    const totalTax=fed+payroll+stateTax+niit+A.due;
    const expenses=gen+health+ltcCost+irmaa;

    /* ---------- STEP 15 — cash flow ---------- */
    const income=w2+bizAllowed+otherInc+ss+rmd+portfolioInc+reIncome+windfall;
    /* saleProceeds are capital, not income — added to the balance sheet below */
    let surplus=income-expenses-totalTax-pretaxContrib-rothContrib;

    /* ---------- STEP 16 — growth, then withdrawals ---------- */
    pretax=pretax*(1+rRet)+pretaxContrib*Math.pow(1+rRet,.5)-rmd-rothConv;
    roth=roth*(1+rRet)+rothContrib*Math.pow(1+rRet,.5)+rothConv;
    const taxGrowth=taxable*rTax;
    taxable=taxable+taxGrowth+Math.max(0,surplus)+saleProceeds;
    /* Sale proceeds arrive with full basis — the gain was taxed this year. */
    taxableBasis+=Math.max(0,surplus)+saleProceeds;
    if(surplus<0){
      let need=-surplus;
      const takeT=Math.min(taxable,need);
      if(takeT>0&&taxable>0){
        /* gain was already booked in the pre-pass above; here we only move basis */
        const gainFrac=Math.max(0,1-taxableBasis/taxable);
        taxableBasis=Math.max(0,taxableBasis-takeT*(1-gainFrac));
      }
      taxable-=takeT;need-=takeT;
      const takeP=Math.min(Math.max(0,pretax),need);pretax-=takeP;need-=takeP;
      const takeR=Math.min(Math.max(0,roth),need);roth-=takeR;need-=takeR;
      if(need>0&&!rows.some(r=>r.depleted))
        notes.push({t:'b',y:year,m:`Age ${age}: accounts run out. The plan is short by ${money(need)} this year.`});
    }
    pretax=Math.max(0,pretax);roth=Math.max(0,roth);taxable=Math.max(0,taxable);
    priorPretax=pretax;

    /* ---------- STEP 17 — insurance roll-forward + lapse test ---------- */
    let cv=0,db=0,polLoan=0;
    pols.forEach(p=>{
      if(p._lapsed)return;
      const prem=working?N(p.annualPremium):0;
      const load=prem*.07;
      const netAtRisk=Math.max(0,N(p.face)-p._cv);
      const coi=(netAtRisk/1000)*coiPer1000(age);      /* per $1,000 of net amount at risk */
      const cr=(N(p.creditRate)/100||.055);
      p._basis+=prem;
      p._cv=p._cv+prem-load-coi+p._cv*cr;
      if(!working&&N(p.planLoans)>0){p._loan=p._loan*(1+(N(p.loanRate)/100||.05))+N(p.planLoans);}
      else if(p._loan>0){p._loan*=(1+(N(p.loanRate)/100||.05));}
      if(p._loan>p._cv&&p._cv>0){
        p._lapsed=true;
        const gain=Math.max(0,p._loan-p._basis);
        notes.push({t:'b',y:year,m:`Age ${age}: the policy lapses. Loans of ${money(p._loan)} exceed its value, creating a taxable gain of ${money(gain)}.`});
      }
      cv+=Math.max(0,p._cv);db+=N(p.face);polLoan+=p._loan;
    });

    /* ---------- DWC deployment — approved savings into the six buckets ---------- */
    let dwcThisYear=0;
    const savingsThisYear=strat.length?stratInYear(year):netTaxSavings;
    if(working&&savingsThisYear>0){
      const dwcBase=(savingsThisYear+dwcPct*N(s.qualifiedDeductionBase))*effectiveness;
      dwcThisYear=dwcBase*Math.pow(1+gGrow,n);
      Object.keys(bucket).forEach(k=>{bucket[k]+=dwcThisYear*alloc[k];});
    }
    Object.keys(bucket).forEach(k=>{bucket[k]*=(1+(bucketRate[k]||0));});
    const dwcTotal=Object.values(bucket).reduce((a,b)=>a+b,0);

    /* ---------- STEP 18 — real estate equity ---------- */
    let reEquity=0,reValue=0;
    props.forEach(p=>{if(!p._sold){reEquity+=Math.max(0,p._val-p._bal);reValue+=p._val;}});

    /* ---------- STEP 19 — estate value ---------- */
    const insInEstate=pols.reduce((t,p)=>t+(p.owner==='ilit'&&p.transferred3yr!=='y'?0:N(p.face)),0);
    const gross=pretax+roth+taxable+cv-polLoan+reEquity+N(s.otherAssets)+insInEstate;
    /* lifetime taxable gifts already made consume the exclusion — IRC §2001(b) */
    const excl=Math.max(0,C.ESTATE.excl*iAdj+N(s.dsue)-N(s.priorGifts));
    const fedEstate=Math.max(0,(gross-N(s.debts)-excl))*C.ESTATE.rate;
    const se=C.STATE_ESTATE[s.state];
    let stateEstate=0;
    if(se){const net=gross-N(s.debts);
      /* NY-style cliff: exceed 105% of the exemption and the WHOLE estate is taxed */
      const taxBase=(se.cliff&&se.cliffPct)
        ? (net>se.t*se.cliffPct?net:0)
        : Math.max(0,net-se.t);
      if(taxBase>0){let t=0,prev=0;
        for(const[over,rate]of C.STATE_ESTATE_RATES){
          const slice=Math.min(taxBase,over===0?Infinity:over)-prev;
          if(over===0)continue;
          if(slice>0){t+=slice*rate;prev=over;}
          if(taxBase<=over)break;
        }
        if(taxBase>prev)t+=(taxBase-prev)*C.STATE_ESTATE_RATES[C.STATE_ESTATE_RATES.length-1][1];
        stateEstate=t;}}
    const irdTax=pretax*heirRate;
    const netToHeirs=Math.max(0,gross-N(s.debts)-fedEstate-stateEstate-irdTax);

    /* ---------- STEP 20 — deflate ---------- */
    rows.push({age,year,fs,working,widowed,evts,ssWithheld:R(ssWithheld),realizedGain:R(realizedGain),
      dwc:R(dwcThisYear),dwcTotal:R(dwcTotal),buckets:{...Object.fromEntries(
        Object.entries(bucket).map(([k,v])=>[k,R(v)]))},
      income:R(income),w2:R(w2),ss:R(ss),rmd:R(rmd),biz:R(bizAllowed),
      expenses:R(expenses),ltc:R(ltcCost),irmaa:R(irmaa),
      contrib:R(pretaxContrib+rothContrib),agi:R(agi),ti:R(ti),
      fed:R(fed),payroll:R(payroll),state:R(stateTax),niit:R(niit),amt:R(A.due),
      tax:R(totalTax),qbi:R(qbiDed),ssTaxable:R(ssTaxable),
      pretax:R(pretax),roth:R(roth),taxable:R(taxable),cv:R(cv),reEquity:R(reEquity),
      netWorth:R(gross),estate:R(netToHeirs),ebl:R(ebl),
      passiveSusp:R(passiveSusp),nol:R(nol),
      real:R(gross/iAdj),estateReal:R(netToHeirs/iAdj),gateFail,
      depleted:surplus<0&&taxable+pretax+roth<=0});
  }
  const totTax=N(s.totalTax);
  const fedSav=strat.reduce((t,x)=>t+N(x.federalTaxSavings),0);
  const stSav=strat.reduce((t,x)=>t+N(x.stateTaxSavings),0);
  return{rows,notes,meta:{startAge,endAge,retAge,rmdAge,birthYear,infl,baseYear,
    netTaxSavings,annualDWC,alloc,allocSum,dwcPct,totalTax:totTax,
    fedProtectionPct:totTax>0?Math.min(100,Math.round(fedSav/totTax*100)):0,
    stateProtectionPct:totTax>0?Math.min(100,Math.round(stSav/totTax*100)):0,
    strategyCount:strat.length,
    isSSTB:C.SSTB_YES.includes(s.bizField),fsFinal:fs}};
}


/* ==========================================================================
   PART E — UI
   ========================================================================== */
function money(v){const n=Math.round(N(v));
  return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US');}
function moneyK(v){const n=Math.round(N(v));
  if(Math.abs(n)>=1e6)return(n<0?'-':'')+'$'+(Math.abs(n)/1e6).toFixed(2)+'M';
  if(Math.abs(n)>=1e3)return(n<0?'-':'')+'$'+Math.round(Math.abs(n)/1e3)+'K';
  return money(n);}
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state={}, step=0;
const LS='roadmap90.v1';

function save(){try{localStorage.setItem(LS,JSON.stringify({state,step}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');
  if(d&&d.state){state=d.state;step=d.step||0;return true;}}catch(e){}return false;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),1900);}

/* ---------- field rendering ---------- */
function field(f,val,path){
  if(f.show&&!f.show(state))return '';
  const id='f_'+path.replace(/\./g,'_');
  const v=val??'';
  let ctl;
  if(f.t==='select'){
    ctl=`<select id="${id}" data-p="${path}">`+
      (f.o||[]).map(([ov,ol])=>`<option value="${esc(ov)}"${String(v)===String(ov)?' selected':''}>${esc(ol)}</option>`).join('')+
      `</select>`;
  } else if(f.t==='textarea'){
    ctl=`<textarea id="${id}" data-p="${path}">${esc(v)}</textarea>`;
  } else if(f.t==='check'){
    return `<div class="f chkf${f.w?' wide':''}">
      <span aria-hidden="true"></span>
      <label class="chk"><input type="checkbox" id="${id}" data-p="${path}"${v?' checked':''}>
        <span>${esc(f.l)}</span></label>
      ${f.h?`<span class="hint">${esc(f.h)}</span>`:'<span></span>'}</div>`;
  } else {
    const t=f.t==='date'?'date':(f.t==='num'||f.t==='year')?'number':'text';
    const ph=placeholderFor(f);
    const aff=f.t==='money'?'money':f.t==='pct'?'pct':'';
    const inp=`<input type="${t}" id="${id}" data-p="${path}" value="${esc(v)}"
      placeholder="${esc(ph)}" ${aff?`data-fmt="${aff}"`:''}
      ${f.t==='money'?'inputmode="decimal" autocomplete="off"':''}
      ${f.t==='pct'?'inputmode="decimal" step="0.1"':''}>`;
    ctl=aff?`<div class="affix ${aff}">${inp}</div>`:inp;
  }
  const missing=f.req&&(v===''||v===undefined);
  const touched=state.__touched&&state.__touched[path];
  const bad=missing&&touched;
  /* third row is always emitted — empty if there is no hint — so the subgrid rows
     stay in step and every control in a row sits on the same baseline */
  const foot=bad?`<span class="emsg">This one is needed for the projection</span>`
                :f.h?`<span class="hint">${esc(f.h)}</span>`:`<span class="hint"></span>`;
  return `<div class="f${f.w?' wide':''}${bad?' err':''}${f.t==='textarea'?' tall':''}">
    <label for="${id}">${esc(f.l)}${f.req?' <span style="color:#a4262c" title="Required">*</span>':''}</label>
    ${ctl}${foot}</div>`;
}

function repSummary(key,it){
  const m=v=>v?money(v):'';
  if(key==='props'){
    const cls=it.rentType==='str'?`STR ${it.avgStay||'?'}-day avg`:it.rentType==='ltr'?'Long-term':it.kind||'';
    return [it.label,cls,m(it.value)].filter(Boolean).join(' · ');
  }
  if(key==='k1s')return [it.name,it.etype==='part'?'Partnership':it.etype==='scorp'?'S-corp':'',
    it.ordinary?m(it.ordinary):''].filter(Boolean).join(' · ');
  if(key==='policies')return [({term:'Term',whole:'Whole life',ul:'UL',iul:'IUL',vul:'VUL'})[it.ptype]||'',
    it.face?m(it.face)+' benefit':''].filter(Boolean).join(' · ');
  if(key==='accounts')return [({t401k:'Traditional 401(k)',r401k:'Roth 401(k)',tira:'Traditional IRA',
    rira:'Roth IRA',sep:'SEP IRA',simple:'SIMPLE',t403b:'403(b)',t457:'457(b)',hsa:'HSA'})[it.type]||'',
    it.balance?m(it.balance):''].filter(Boolean).join(' · ');
  return '';
}
/* A step may declare rep:{...} or reps:[{...},{...}] */
function repsOf(m){ return m.reps ? m.reps : (m.rep ? [m.rep] : []); }

function renderStep(){
  const m=SCHEMA[step];
  let h=`<div class="card"><h2><span class="mnum">Module ${step}</span> ${esc(m.n)}</h2>
    <p class="lede">${esc(m.lede)}</p>`;

  {
    if(m.fields.length) h+=`<div class="grid">`+m.fields.map(f=>field(f,state[f.k],f.k)).join('')+`</div>`;
    /* a step may hold SEVERAL repeatable sections (properties AND K-1s, say) */
    repsOf(m).forEach(rep=>{
      const key=rep.key, list=state[key]||[];
      if(rep.heading)h+=`<h3 class="sub">${esc(rep.heading)}</h3>`;
      if(rep.fields2&&rep.fields2.length)
        h+=`<div class="grid">`+rep.fields2.map(f=>field(f,state[f.k],f.k)).join('')+`</div>`;
      h+=`<fieldset style="margin-top:16px"><legend>${esc(rep.label)}s — ${list.length} added</legend>`;
      if(!list.length)h+=`<div class="empty"><div style="font-size:1.6rem;opacity:.35;margin-bottom:4px">+</div>
        <b>No ${esc(rep.label)}s yet</b><br>
        <span style="font-size:.8rem">Add one if it applies to you — otherwise move on. This part is optional.</span></div>`;
      list.forEach((item,i)=>{
        h+=`<div class="rep"><div class="rep-hd"><strong>${esc(rep.label)} ${i+1}</strong>
          <small>${esc(repSummary(key,item))}</small>
          <button class="btn-sec btn-sm" data-dup="${key}:${i}">Duplicate</button>
          <button class="btn-danger btn-sm" data-del="${key}:${i}">Remove</button></div>
          <div class="grid">`+
          rep.fields.map(f=>{
            if(f.show&&!f.show(item))return '';
            return field({...f,show:null},item[f.k],`${key}[${i}].${f.k}`);
          }).join('')+`</div></div>`;
      });
      h+=`<button class="btn-sec btn-sm" data-add="${key}">+ Add ${esc(rep.label)}</button></fieldset>`;
    });
    if(m.review) h+=`<h3 class="sub">Check your details</h3>`+reviewHtml();
  }
  h+=`</div>`;
  $('wizard').innerHTML=h;
  bind();
  renderProgress();
  $('btnBack').disabled=step===0;
  $('btnNext').classList.toggle('hide',step===SCHEMA.length-1);
  $('btnRun').classList.toggle('hide',step!==SCHEMA.length-1);
  $('navInfo').textContent=`Module ${step} of ${SCHEMA.length-1}`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function moduleFill(m){
  const fs=(m.fields||[]).filter(f=>!f.show||f.show(state));
  const reps=repsOf(m);
  if(!fs.length)return reps.length?(reps.some(r=>(state[r.key]||[]).length)?1:0):1;
  const done=fs.filter(f=>{const v=state[f.k];return v!==undefined&&v!=='';}).length;
  return done/fs.length;
}
function renderProgress(){
  $('progSteps').innerHTML=SCHEMA.map((m,i)=>{
    const p=moduleFill(m), cls=p>=1?'full':p>0?'part':'';
    return `<button class="pstep ${i===step?'cur':p>=1?'done':''}" data-go="${i}"
      title="${Math.round(p*100)}% complete">
      <span class="ring ${cls}" style="--p:${Math.round(p*100)}%"></span>${i}. ${esc(m.n)}</button>`;}).join('');
  const overall=SCHEMA.reduce((t,m)=>t+moduleFill(m),0)/SCHEMA.length;
  $('progBar').style.width=(overall*100)+'%';
}

function setPath(p,v){
  const rm=p.match(/^(\w+)\[(\d+)\]\.(\w+)$/);
  if(rm){(state[rm[1]]=state[rm[1]]||[])[+rm[2]][rm[3]]=v;}
  else state[p]=v;
}
function bind(){
  document.querySelectorAll('#wizard [data-p]').forEach(el=>{
    const h=()=>{setPath(el.dataset.p,el.type==='checkbox'?el.checked:el.value);
      save();
      if(el.tagName==='SELECT')renderStep();};
    el.addEventListener('change',h);
    el.addEventListener('blur',()=>{(state.__touched=state.__touched||{})[el.dataset.p]=1;
      if(el.value==='')renderStep();});
    if(el.tagName!=='SELECT')el.addEventListener('input',()=>{
      if(el.dataset.fmt==='money'){
        const caretEnd=el.selectionStart===el.value.length;
        const raw=el.value.replace(/[^0-9.\-]/g,'');
        const parts=raw.split('.');
        const whole=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
        el.value=parts.length>1?whole+'.'+parts[1].slice(0,2):whole;
        if(caretEnd)el.setSelectionRange(el.value.length,el.value.length);
      }
      setPath(el.dataset.p,el.type==='checkbox'?el.checked:el.value);save();});
  });
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.add;(state[k]=state[k]||[]).push({});save();renderStep();});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const[k,i]=b.dataset.del.split(':');
    if(confirm('Remove this entry?')){state[k].splice(+i,1);save();renderStep();}});
  document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{
    const[k,i]=b.dataset.dup.split(':');
    state[k].splice(+i+1,0,JSON.parse(JSON.stringify(state[k][+i])));save();renderStep();toast('Duplicated');});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{step=+b.dataset.go;renderStep();});
}




/* ==========================================================================
   CHARTS — inline SVG, no library, theme-safe
   ========================================================================== */
function chartLine(rows,meta,real){
  const W=1000,H=300,P={t:16,r:16,b:28,l:64};
  const f=r=>real?Math.pow(1+meta.infl,r.age-meta.startAge):1;
  const pts=rows.map(r=>({x:r.age,y:r.netWorth/f(r),e:r.estate/f(r)}));
  const maxY=Math.max(...pts.map(p=>p.y),1);
  const x=a=>P.l+(a-meta.startAge)/(meta.endAge-meta.startAge)*(W-P.l-P.r);
  const y=v=>H-P.b-(v/maxY)*(H-P.t-P.b);
  const path=k=>pts.map((p,i)=>(i?'L':'M')+x(p.x).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ');
  const area=path('y')+` L ${x(meta.endAge).toFixed(1)} ${H-P.b} L ${x(meta.startAge).toFixed(1)} ${H-P.b} Z`;
  const ticks=[0,.25,.5,.75,1].map(t=>{const v=maxY*t;
    return `<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="#e2e8f2"/>
      <text x="${P.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5b6b82">${moneyK(v)}</text>`;}).join('');
  const marks=[];
  const mk=(a,lbl,col)=>{if(a<meta.startAge||a>meta.endAge)return;
    marks.push(`<line x1="${x(a)}" y1="${P.t}" x2="${x(a)}" y2="${H-P.b}" stroke="${col}" stroke-dasharray="4 3"/>
      <text x="${x(a)+4}" y="${P.t+12}" font-size="10" fill="${col}" font-weight="600">${lbl}</text>`);};
  mk(meta.retAge,'Retire','#b8860b'); mk(meta.rmdAge,'RMD','#1d5f9c');
  rows.filter(r=>r.evts.length).forEach(r=>mk(r.age,r.evts[0].split('—')[0].trim().slice(0,14),'#a4262c'));
  const xl=[];for(let a=meta.startAge;a<=meta.endAge;a+=10)
    xl.push(`<text x="${x(a)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#5b6b82">${a}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth over time">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5f9c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1d5f9c" stop-opacity=".02"/></linearGradient></defs>
    ${ticks}<path d="${area}" fill="url(#g1)"/>
    <path d="${path('y')}" fill="none" stroke="#1d5f9c" stroke-width="2.5"/>
    <path d="${path('e')}" fill="none" stroke="#0f7b4f" stroke-width="2" stroke-dasharray="5 4"/>
    ${marks.join('')}${xl.join('')}</svg>
  <div class="lg"><span><i style="background:#1d5f9c"></i>Net worth</span>
    <span><i style="background:#0f7b4f"></i>Net to heirs after tax</span>
    <span><i style="background:#b8860b"></i>Retirement</span>
    <span><i style="background:#a4262c"></i>Life event</span></div>`;
}
function chartTax(rows,meta,real){
  const W=1000,H=230,P={t:14,r:16,b:28,l:64};
  const f=r=>real?Math.pow(1+meta.infl,r.age-meta.startAge):1;
  const keys=[['fed','#1d5f9c','Federal'],['state','#b8860b','State'],
              ['payroll','#5b6b82','Payroll'],['niit','#0f7b4f','NIIT'],
              ['amt','#a4262c','AMT'],['irmaa','#8a5a00','IRMAA']];
  const max=Math.max(...rows.map(r=>r.tax/f(r)),1);
  const bw=(W-P.l-P.r)/rows.length;
  const bars=rows.map((r,i)=>{let yy=H-P.b;const X=P.l+i*bw;
    return keys.map(([k,c])=>{const v=(r[k]||0)/f(r);const h=(v/max)*(H-P.t-P.b);
      yy-=h;return h>0.4?`<rect x="${X.toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(bw-.6,.7).toFixed(1)}" height="${h.toFixed(1)}" fill="${c}"/>`:'';}).join('');
  }).join('');
  const ticks=[0,.5,1].map(t=>`<line x1="${P.l}" y1="${H-P.b-t*(H-P.t-P.b)}" x2="${W-P.r}" y2="${H-P.b-t*(H-P.t-P.b)}" stroke="#e2e8f2"/>
    <text x="${P.l-8}" y="${H-P.b-t*(H-P.t-P.b)+4}" text-anchor="end" font-size="11" fill="#5b6b82">${moneyK(max*t)}</text>`).join('');
  const xl=[];for(let i=0;i<rows.length;i+=10)
    xl.push(`<text x="${(P.l+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#5b6b82">${rows[i].age}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tax by type each year">
    ${ticks}${bars}${xl.join('')}</svg>
  <div class="lg">${keys.map(([k,c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`;
}
function chartBuckets(rows,meta,real){
  const W=1000,H=230,P={t:14,r:16,b:28,l:64};
  const f=r=>real?Math.pow(1+meta.infl,r.age-meta.startAge):1;
  const keys=[['pretax','#12385f','Pre-tax'],['roth','#0f7b4f','Roth'],
              ['taxable','#1d5f9c','Taxable'],['cv','#b8860b','Insurance CV'],['reEquity','#8a5a00','Real estate']];
  const tot=r=>keys.reduce((t,[k])=>t+(r[k]||0),0)/f(r);
  const max=Math.max(...rows.map(tot),1);
  const x=i=>P.l+i/(rows.length-1)*(W-P.l-P.r);
  const y=v=>H-P.b-(v/max)*(H-P.t-P.b);
  let acc=rows.map(()=>0),paths='';
  keys.forEach(([k,c])=>{
    const up=rows.map((r,i)=>{acc[i]+=(r[k]||0)/f(r);return acc[i];});
    const lo=up.map((v,i)=>v-(rows[i][k]||0)/f(rows[i]));
    paths+=`<path d="${up.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')} ${lo.map((v,i)=>'L'+x(lo.length-1-i).toFixed(1)+' '+y(lo[lo.length-1-i]).toFixed(1)).join(' ')} Z" fill="${c}" opacity=".85"/>`;
  });
  const ticks=[0,.5,1].map(t=>`<line x1="${P.l}" y1="${y(max*t)}" x2="${W-P.r}" y2="${y(max*t)}" stroke="#e2e8f2"/>
    <text x="${P.l-8}" y="${y(max*t)+4}" text-anchor="end" font-size="11" fill="#5b6b82">${moneyK(max*t)}</text>`).join('');
  const xl=[];for(let i=0;i<rows.length;i+=10)
    xl.push(`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#5b6b82">${rows[i].age}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Where the money sits">
    ${ticks}${paths}${xl.join('')}</svg>
  <div class="lg">${keys.map(([k,c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`;
}

let LAST=null, showReal=false;
function runProjection(){
  const P=project(state); LAST=P;
  const R_=P.rows, meta=P.meta;

  const last=R_[R_.length-1];
  const totalDist=R_.filter(r=>r.age>=meta.retAge).reduce((t,r)=>t+r.rmd+Math.max(0,r.income-r.w2-r.ss),0);
  const totalTax=R_.reduce((t,r)=>t+r.tax,0);
  const V=r=>showReal?r.real:r.netWorth;

  const miles=[42,45,50,55,meta.retAge,70,80,90,100].filter(a=>a>=meta.startAge&&a<=meta.endAge)
    .filter((a,i,ar)=>ar.indexOf(a)===i);

  let h=`<div class="card"><h2>Projection — ages ${meta.startAge} to ${meta.endAge}</h2>
   <p class="lede">${R_.length} years, ${showReal?"shown in today's dollars":'shown in future dollars'}.</p>
   <div class="tabs">
     <button class="tab ${!showReal?'on':''}" id="tabNom">Future dollars</button>
     <button class="tab ${showReal?'on':''}" id="tabReal">Today's dollars</button>
   </div>

     <div class="kpi"><div class="k">Net worth at retirement (${meta.retAge})</div><div class="v">${moneyK(showReal?atRet.real:atRet.netWorth)}</div></div>
     <div class="kpi"><div class="k">Net worth at ${meta.endAge}</div><div class="v">${moneyK(showReal?last.real:last.netWorth)}</div></div>

     <div class="kpi dark"><div class="k">Lifetime tax paid</div><div class="v">${moneyK(totalTax)}</div></div>
   </div>
   <div class="miles">${miles.map(a=>{const r=R_.find(x=>x.age===a);if(!r)return'';
     return `<div class="mile ${a===meta.retAge?'r':''}"><div class="a">Age ${a}</div>
       <div class="ph">${a<meta.retAge?'Accumulation':a<meta.rmdAge?'Pre-RMD window':'Distribution'}</div>
       <div class="v">${moneyK(V(r))}</div></div>`;}).join('')}</div>`;

  if(meta.annualDWC>0){
    const bl=[['retirement','401(k) / Cash balance / Roth'],['insurance','Life insurance cash value'],
              ['realestate','Real estate / business'],['liquidity','Liquidity reserve'],
              ['legacy','Legacy / trust / philanthropy'],['disabilityLtc','Disability / LTC protection']];
    const atR=R_.find(r=>r.age>=meta.retAge)||R_[R_.length-1];
    h+=`<h3 style="margin-top:22px">Deployable Wealth Capital roadmap</h3>
      ${meta.totalTax>0?`<div class="kpis" style="margin-top:0">
        <div class="kpi"><div class="k">Federal tax protected</div><div class="v">${meta.fedProtectionPct}%</div></div>
        <div class="kpi"><div class="k">State tax protected</div><div class="v">${meta.stateProtectionPct}%</div></div>
        <div class="kpi"><div class="k">Strategies applied</div><div class="v">${meta.strategyCount}</div></div>
        <div class="kpi"><div class="k">Total tax before strategies</div><div class="v">${moneyK(meta.totalTax)}</div></div>
      </div>`:''}
      <p class="lede"><b>${money(meta.annualDWC)}</b> deployed every working year, split across six buckets.</p>
      <div class="miles">${[42,45,50,55,meta.retAge,70,80,90,100]
        .filter(a=>a>=meta.startAge&&a<=meta.endAge).filter((a,i,ar)=>ar.indexOf(a)===i)
        .map(a=>{const r=R_.find(x=>x.age===a);if(!r)return'';
          return `<div class="mile ${a===meta.retAge?'r':''}"><div class="a">Age ${a}</div>
            <div class="ph">${a<meta.retAge?'Contribution':'Distribution'}</div>
            <div class="v">${moneyK(showReal?r.dwcTotal/Math.pow(1+meta.infl,a-meta.startAge):r.dwcTotal)}</div></div>`;}).join('')}</div>
      <div class="tw"><table><thead><tr><th>Bucket</th><th>Share</th>
        <th>At retirement (${meta.retAge})</th><th>At ${meta.endAge}</th></tr></thead><tbody>
        ${bl.map(([k,lbl])=>{const f1=showReal?Math.pow(1+meta.infl,atR.age-meta.startAge):1;
          const f2=showReal?Math.pow(1+meta.infl,meta.endAge-meta.startAge):1;
          return `<tr><td>${lbl}</td><td>${Math.round(meta.alloc[k]*100)}%</td>
            <td>${money(atR.buckets[k]/f1)}</td>
            <td>${money(R_[R_.length-1].buckets[k]/f2)}</td></tr>`;}).join('')}
        <tr style="font-weight:650"><td>Total</td><td>100%</td>
          <td>${money(atR.dwcTotal/(showReal?Math.pow(1+meta.infl,atR.age-meta.startAge):1))}</td>
          <td>${money(R_[R_.length-1].dwcTotal/(showReal?Math.pow(1+meta.infl,meta.endAge-meta.startAge):1))}</td></tr>
        </tbody></table></div>`;
  }
  h+=`<h3 style="margin-top:20px">Net worth and legacy</h3>${chartLine(R_,meta,showReal)}
   <h3 style="margin-top:20px">Where the money sits</h3>${chartBuckets(R_,meta,showReal)}
   <h3 style="margin-top:20px">Tax by type, each year</h3>${chartTax(R_,meta,showReal)}`;

  /* notes from the run */
  if(P.notes.length){
    h+=`<h3 style="margin-top:18px">What the projection found</h3>`+
      P.notes.map(nt=>`<div class="note ${nt.t}"><b>${nt.y}</b> — ${esc(nt.m)}</div>`).join('');
  }
  /* the pre-RMD window */
  const win=R_.filter(r=>r.age>=meta.retAge&&r.age<meta.rmdAge);
  if(win.length){
    const avgTax=win.reduce((t,r)=>t+r.fed,0)/win.length;
    h+=`<div class="note o"><b>Conversion window:</b> ages ${meta.retAge}–${meta.rmdAge-1}
      (${win.length} years), averaging ${money(avgTax)} of federal tax a year.</div>`;
  }
  h+=`</div>`;

  /* year table */
  h+=`<div class="card"><h3>Year by year</h3>

   <th>Total tax</th><th>Expenses</th><th>Pre-tax</th><th>Roth</th><th>Taxable</th>
   <th>Cash value</th><th>RE equity</th><th>Net worth</th><th>Estate</th></tr></thead><tbody>`;
  R_.forEach(r=>{
    const f=showReal?Math.pow(1+meta.infl,r.age-meta.startAge):1;
    const d=v=>money(v/f);
    h+=`<tr class="${r.evts.length?'evt':''} ${r.age===meta.retAge?'ret':''}">

      <td>${d(r.cv)}</td><td>${d(r.reEquity)}</td><td><b>${d(r.netWorth)}</b></td>
      <td>${d(r.estate)}</td></tr>`;
    if(r.evts.length)h+=`<tr class="evt"><td colspan="21" style="text-align:left">↳ ${r.evts.map(esc).join(' · ')}</td></tr>`;
  });
  h+=`</tbody></table></div>
   <p><small>⚑ marks a year with a life event. Estate is the amount left after tax.</small></p></div>`;

  $('results').innerHTML=h;
  $('tabNom').onclick=()=>{showReal=false;runProjection();};
  $('tabReal').onclick=()=>{showReal=true;runProjection();};
  const bad=R_.filter(r=>r.gateFail).length;
  if(bad)toast(`⚠ Conservation check failed in ${bad} year(s)`);
  $('results').scrollIntoView({behavior:'smooth'});
}

function selfTest(){
  const T=[],add=(n,exp,got,dp)=>T.push({n,exp,got,ok:Math.abs(exp-got)<(dp??1)});
  const one=x=>x;
  add('T1 MFJ tax on $300,000',57196,bracketTax(300000,C.BRACKETS.mfj,1));
  add('T1 MFJ tax on $100,800',11600,bracketTax(100800,C.BRACKETS.mfj,1));
  add('T1 Single tax on $50,400',5800,bracketTax(50400,C.BRACKETS.single,1));
  add('T2 PIA at AIME $10,000',3563.20,pia(10000),.01);
  add('T2 PIA at AIME $5,000',2345.80,pia(5000),.01);
  add('T2 PIA at AIME $1,000',900.00,pia(1000),.01);
  const bp=bendPoints(C.SS.awi2024);
  add('T3 bend point 1 derived',1286,bp.b1);
  add('T3 bend point 2 derived',7749,bp.b2);
  add('T4 taxable SS, other $60,000',34000,taxableSS(40000,60000,0,C.SS.taxThr.mfj));
  add('T4 taxable SS, other $10,000',0,taxableSS(40000,10000,0,C.SS.taxThr.mfj));
  add('T4 taxable SS, other $20,000',4000,taxableSS(40000,20000,0,C.SS.taxThr.mfj));
  add('T5 RMD at 75 on $1,000,000',40650,1e6/ultDiv(75));
  add('T5 RMD at 73 on $1,000,000',37736,1e6/ultDiv(73));
  add('T5 RMD at 90 on $1,000,000',81967,1e6/ultDiv(90));
  add('T6 mortgage payment',3160.34,mortPayment(500000,.065,360),.01);
  add('T6 balance after 10 years',423881,mortBalance(500000,.065,360,120));
  add('T6 total interest',637722,mortPayment(500000,.065,360)*360-500000);
  add('T7 401(k) limit at 45',24500,C.LIM.d401k+catchUp(45));
  add('T7 401(k) limit at 55',32500,C.LIM.d401k+catchUp(55));
  add('T7 401(k) limit at 62',35750,C.LIM.d401k+catchUp(62));
  add('T7 401(k) limit at 64',32500,C.LIM.d401k+catchUp(64));
  /* extra: the widow's penalty from research/02-TAXES.md §9b */
  const mfjSS=taxableSS(70758,80000,0,C.SS.taxThr.mfj);
  add('W MFJ taxable SS',60144,mfjSS);
  add('W MFJ federal tax',12446,bracketTax(80000+mfjSS-35500,C.BRACKETS.mfj,1));
  const sglSS=taxableSS(42758,80000,0,C.SS.taxThr.single);
  add('W Single taxable SS',36344,sglSS);
  add('W Single federal tax',16315,bracketTax(80000+sglSS-18150,C.BRACKETS.single,1));
  /* conservation identity */
  const g=runGates(120000,80000,50000,true,0,0);
  add('Conservation: allowed+susp = loss',120000,g.allowed+g.sBasis+g.sAtRisk+g.sPassive);
  add('Gate 2 blocks $30,000',30000,g.sAtRisk);

  const pass=T.filter(t=>t.ok).length;
  const host=$('selftest');
  if(!host)return{pass,total:T.length,T};        // panel is commented out — skip rendering
  host.innerHTML=`<div class="card"><h3>Engine self-test
    <span class="badge ${pass===T.length?'p':'f'}">${pass}/${T.length} passing</span></h3>
    <p class="lede">These are the hand-checkable test vectors from
      <code>research/10-SOURCES-AND-COMPETITORS.md</code>, run against this page's own engine.
      If any fail, the engine disagrees with the verified research.</p>
    ${T.map(t=>`<div class="tst ${t.ok?'p':'f'}">${t.ok?'✓':'✗'} ${esc(t.n)}
      <span class="n">${t.exp.toLocaleString()} vs ${(Math.round(t.got*100)/100).toLocaleString()}</span></div>`).join('')}
    </div>`;
  return{pass,total:T.length,T};
}
